name: Build Android APK (ExecuTorch On-Device AI)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: ðŸ“¥ Clonar repositÃ³rio
        uses: actions/checkout@v4

      - name: ðŸ” Localizar diretÃ³rio raiz do projeto
        id: locate_project
        run: |
          PKG_PATH=$(find . -name "package.json" -not -path "*/node_modules/*" | head -n 1)
          if [ -z "$PKG_PATH" ]; then
            echo "âŒ package.json nÃ£o foi encontrado em nenhuma pasta do repositÃ³rio!"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$PKG_PATH")
          echo "ðŸ“ DiretÃ³rio do projeto encontrado em: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> $GITHUB_OUTPUT

      - name: â˜• Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: ðŸŸ¢ Configurar Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: ðŸ¤– Configurar Android SDK e NDK
        uses: android-actions/setup-android@v3

      - name: ðŸ“¦ Instalar Android NDK e CMake
        run: |
          sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV

      - name: ðŸ“¦ Instalar dependÃªncias do projeto
        working-directory: ${{ steps.locate_project.outputs.project_dir }}
        run: |
          if [ -f "yarn.lock" ]; then
            npm install --global yarn
            yarn install --network-timeout 1000000
          elif [ -f "package-lock.json" ]; then
            npm ci || npm install --legacy-peer-deps
          else
            npm install --legacy-peer-deps
          fi

      - name: âš™ï¸ Configurar permissÃµes do Gradle
        working-directory: ${{ steps.locate_project.outputs.project_dir }}
        run: |
          chmod +x android/gradlew || chmod +x gradlew || true

      - name: ðŸš€ Compilar APK (Release)
        working-directory: ${{ steps.locate_project.outputs.project_dir }}/android
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace \
            -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1024m"

      - name: ðŸ” Localizar APK gerado
        id: find_apk
        run: |
          APK_PATH=$(find . -name "*.apk" -not -path "*/intermediates/*" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "âŒ Nenhum APK encontrado!"
            exit 1
          fi
          echo "APK encontrado em: $APK_PATH"
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT

      - name: ðŸ“¤ Fazer upload do APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: ondevice-ai-app
          path: ${{ steps.find_apk.outputs.apk_path }}
          retention-days: 7
